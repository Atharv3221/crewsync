spring.application.name=crewrite

spring.datasource.url=jdbc:h2:mem:crewrite-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.test.database.replace=none

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

crewrite.ws.allowed-origin-patterns=*
