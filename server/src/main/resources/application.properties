spring.application.name=crewsync
server.port=${PORT:8080}

# Database: env vars win; defaults are for local development
spring.datasource.url=${DATABASE_URL_CREWSYNC:jdbc:postgresql://localhost:5432/crewrite}
spring.datasource.username=${DATABASE_USER_CREWSYNC:crewrite}
spring.datasource.password=${DATABASE_PASSWORD_CREWSYNC:crewrite}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma-separated origin patterns allowed to call /api (CORS) and open /ws/{docId}
crewsync.allowed-origin-patterns=${ALLOWED_ORIGINS_CREWSYNC:http://localhost:5173}

# Auth: JWT_SECRET_CREWSYNC is a base64-encoded HS256 key of at least 32 bytes (openssl rand -base64 32)
jwt.secret=${JWT_SECRET_CREWSYNC}
jwt.ttl=${JWT_TTL_CREWSYNC:7d}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
