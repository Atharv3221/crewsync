spring.application.name=crewrite
server.port=${PORT:8080}

# Database: env vars win; defaults are for local development
spring.datasource.url=${DATABASE_URL_CREWSYNC:jdbc:postgresql://localhost:5432/crewrite}
spring.datasource.username=${DATABASE_USER_CREWSYNC:crewrite}
spring.datasource.password=${DATABASE_PASSWORD_CREWSYNC:crewrite}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
